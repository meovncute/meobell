name: con người tiến hpaa

on:
  workflow_dispatch:


jobs:
  cloudphone:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Cài phần mềm
        run: |
          sudo apt update -y
      - name: Tạo Cloudflare Tunnel & gửi Webhook
        run: |
          wget -O cloudflared https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64
          chmod +x cloudflared
          ./cloudflared tunnel --url http://localhost:6080
          sleep 15
          
          

      - name: Khởi chạy máy ảo QEMU (6 giờ)
        run: |
          sudo chmod 666 /dev/kvm
          echo "✅ Khởi động máy ảo Android..."
          docker run -d -p 6080:6080 -e EMULATOR_DEVICE="Samsung Galaxy S10" -e WEB_VNC=true --device /dev/kvm --name android-container budtmo/docker-android:emulator_9.0
          sleep 3600
